name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  id-token: write    # Required for OIDC token generation
  contents: write    # Required for pushing version bump commit

jobs:
  publish:
    runs-on: ubuntu-latest
    # Prevent infinite loops from version bump commits
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # NOTE: Do NOT set registry-url here — it conflicts with OIDC
          #       Setting registry-url causes setup-node to write an .npmrc
          #       that expects NODE_AUTH_TOKEN, which breaks Trusted Publishing.

      - name: Upgrade npm to latest (OIDC requires >= v11.5.1)
        run: |
          npm install -g npm@latest
          echo "npm version: $(npm --version)"
          echo "node version: $(node --version)"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: npm version patch -m "chore(release): bump to %s [skip ci]"

      - name: Publish to npm (via OIDC Trusted Publishing)
        run: npm publish --provenance --access public

      - name: Push version bump back to repo
        run: git push --follow-tags
